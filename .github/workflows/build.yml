# Builds the three installers automatically on GitHub's Windows, Mac and Linux machines.
# Every push to main builds them and puts them on the Releases page people can download from.
name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_installer.ps1
      - uses: actions/upload-artifact@v4
        with: { name: PrintEasy-Windows, path: dist/installers/*.exe }

  macos:
    needs: test
    runs-on: macos-latest          # Apple Silicon (M1/M2/M3/M4) Macs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build .dmg
        env:
          MAC_SIGN_ID: ${{ secrets.MAC_SIGN_ID }}
          MAC_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
        run: bash packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with: { name: PrintEasy-macOS, path: dist/installers/*.dmg }

  linux:
    needs: test
    runs-on: ubuntu-22.04          # older base = works on more Linux versions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install libraries Qt needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 binutils
      - name: Build .deb
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash -x packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: PrintEasy-Linux, path: dist/installers/*.deb }

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: PrintEasy ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            **Download the one for your computer:**
            - Windows 10/11: `PrintEasy-Setup-…-Windows.exe` — double-click and follow the steps.
            - Mac: `PrintEasy-…-macOS-arm64.dmg` — open it and drag PrintEasy into Applications.
            - Linux (Ubuntu, Mint, Debian): `PrintEasy-…-Linux-amd64.deb` — double-click and press Install.
